<!doctype html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#151820">
    <title>SportBuddy | Meciuri</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/matches.css">
    <script type="module" src="/matches.js"></script>
</head>
<body class="matches-page">
    <header class="matches-header">
        <div class="matches-header-inner">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                <span>SportBuddy</span>
            </div>
            <div class="signed-in">
                <div class="signed-in-details" id="signed-in-details" hidden>
                    <strong id="account-name"></strong>
                    <span id="account-email"></span>
                </div>
                <button type="button" class="secondary" id="sign-out">Deconectează-te</button>
            </div>
        </div>
    </header>

    <main class="matches-main">
        <nav class="app-navigation" aria-label="Navigare SportBuddy">
            <a href="/matches.html" aria-current="page">Meciuri</a>
            <a href="/map.html">Hartă terenuri</a>
        </nav>
        <h1>Meciuri</h1>

        <section class="match-create-section" aria-labelledby="create-match-heading">
            <h2 id="create-match-heading">Creează un meci</h2>
            <p class="section-intro">Alege sportul, terenul, data și numărul maxim de jucători.</p>
            <form class="match-create-form" id="match-form">
                <div class="form-field">
                    <label for="match-sport">Sport</label>
                    <select id="match-sport" name="sport" required>
                        <option value="">Alege sportul</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="match-field">Teren</label>
                    <select id="match-field" name="field" required disabled>
                        <option value="">Se încarcă terenurile…</option>
                    </select>
                    <small class="form-help" id="field-help"></small>
                </div>
                <div class="form-field">
                    <label for="match-start">Data și ora</label>
                    <input id="match-start" name="startTime" type="datetime-local" required>
                </div>
                <div class="form-field">
                    <label for="match-max-players">Număr maxim de jucători</label>
                    <input id="match-max-players" name="maxPlayers" type="number" min="2" value="10" required>
                </div>
                <button class="primary create-match-button" id="create-match" type="submit">Creează meciul</button>
            </form>
            <p class="form-status" id="create-status" role="status" aria-live="polite"></p>
        </section>

        <p class="action-status" id="match-action-status" role="status" aria-live="polite"></p>

        <div class="matches-message" id="matches-message">
            <p id="matches-status" role="status">Se încarcă meciurile…</p>
            <button type="button" class="secondary" id="retry-matches" hidden>Încearcă din nou</button>
        </div>
        <ul class="match-list" id="match-list" hidden></ul>
    </main>

    <template id="match-template">
        <li class="match-card">
            <h2 class="match-sport"></h2>
            <dl class="match-details">
                <div>
                    <dt>Teren</dt>
                    <dd class="match-field"></dd>
                </div>
                <div>
                    <dt>Data și ora</dt>
                    <dd><time class="match-start"></time></dd>
                </div>
                <div class="match-availability">
                    <dt>Locuri libere</dt>
                    <dd><strong class="match-spots"></strong> <span class="match-capacity"></span></dd>
                </div>
            </dl>
            <section class="match-participants" aria-label="Participanții la meci">
                <h3>Participanți <span class="participant-count"></span></h3>
                <ul class="participant-list"></ul>
            </section>
            <div class="match-actions">
                <button type="button" class="primary match-join">Înscrie-te</button>
                <button type="button" class="secondary match-leave" hidden>Retrage-te</button>
                <span class="match-full" hidden>Meci complet</span>
            </div>
        </li>
    </template>
</body>
</html>
